# Opens (or confirms) a release PR so `main` can catch up to `dev`.
# Manual only for now; add `schedule:` under `on:` when you want periodic runs.
name: Sync dev to main (release)

on:
  workflow_dispatch:

concurrency:
  group: sync-dev-to-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    name: Open or confirm release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch branches
        run: git fetch origin dev main

      - name: Count commits on dev not in main
        id: ahead
        run: |
          COUNT=$(git rev-list --count origin/main..origin/dev)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Commits on dev not in main: $COUNT"

      - name: No-op when main already matches dev
        if: steps.ahead.outputs.count == '0'
        run: |
          echo "::notice title=No release needed::\`main\` already includes everything on \`dev\`."
          {
            echo "## Sync dev → main"
            echo "No action needed: **main** is already up to date with **dev**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing open release PR
        id: existing-pr
        if: steps.ahead.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(gh pr list --repo "${{ github.repository }}" --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ]; then
            echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release PR
        if: steps.ahead.outputs.count != '0' && steps.existing-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head dev \
            --title "Release: sync dev → main" \
            --body "Automated release PR: merge after CI passes, then deploy from \`main\`. Opened when \`dev\` is ahead of \`main\`. Re-run **Sync dev to main (release)** if you need a new PR after the previous one was merged or closed.")

          echo "::notice title=Release PR created::$URL"
          {
            echo "## Sync dev → main"
            echo "Created release PR: $URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report existing release PR
        if: steps.ahead.outputs.count != '0' && steps.existing-pr.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh pr view "${{ steps.existing-pr.outputs.number }}" --repo "${{ github.repository }}" --json url --jq '.url')
          echo "::notice title=Release PR already open::PR #${{ steps.existing-pr.outputs.number }} — $URL"
          {
            echo "## Sync dev → main"
            echo "An open **dev** → **main** PR already exists: [#${{ steps.existing-pr.outputs.number }}]($URL)"
            echo "Merge it when ready, or close it and re-run this workflow to open a new one."
          } >> "$GITHUB_STEP_SUMMARY"
