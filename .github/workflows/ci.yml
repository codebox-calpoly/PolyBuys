name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Ensure Linux lightningcss binary is present
        if: runner.os == 'Linux'
        run: |
          LIGHTNINGCSS_VERSION=$(node -e "process.stdout.write(require('lightningcss/package.json').version)")
          npm install --no-save "lightningcss-linux-x64-gnu@${LIGHTNINGCSS_VERSION}"

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Check code formatting
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,md,yml,yaml}"

      - name: Run tests
        run: npm test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Ensure Linux lightningcss binary is present
        if: runner.os == 'Linux'
        run: |
          LIGHTNINGCSS_VERSION=$(node -e "process.stdout.write(require('lightningcss/package.json').version)")
          npm install --no-save "lightningcss-linux-x64-gnu@${LIGHTNINGCSS_VERSION}"

      - name: Build all workspaces
        run: npm run build --if-present
